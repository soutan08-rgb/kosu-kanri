<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#183153"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="工数管理"><link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><title>週間工数管理</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#172b45;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:680px;margin:auto;padding:18px 14px 65px}header{background:#183153;color:white;padding:24px 16px 18px}header h1{font-size:22px;margin:0 auto;max-width:650px}.card{background:white;border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 2px 12px #142a4510}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.muted{color:#64748b;font-size:13px}.big{font-size:36px;font-weight:750;margin:6px 0}.pill{font-size:12px;background:#e8f3ff;border-radius:99px;padding:5px 9px}label{display:block;font-size:13px;font-weight:650;margin:10px 0 5px}input,select,button{font:inherit;min-height:44px;border-radius:10px}input,select{border:1px solid #cbd5e1;padding:9px;width:100%;background:white;color:#172b45}button{border:0;background:#1e65b7;color:white;padding:10px 14px;font-weight:650;cursor:pointer}button.secondary{background:#e9eff6;color:#183153}button.danger{background:#fff1f2;color:#b42335}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.days button{padding:8px 1px;font-size:13px;background:#e9eff6;color:#183153}.days button.active{background:#183153;color:white}.days small{display:block;font-size:10px;margin:3px 0}.result{background:#edf6ff;border-radius:10px;padding:10px;margin-top:12px;display:flex;justify-content:space-between;gap:8px}.entry{border:1px solid #e2e8f0;padding:12px;border-radius:12px;margin:12px 0}.entry h3{margin:0;font-size:14px}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:9px 6px;border-bottom:1px solid #e2e8f0;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}footer{font-size:12px;color:#64748b;line-height:1.6}#warning{color:#b42335;font-size:13px}</style></head><body><header><h1>週間工数管理</h1></header><main><section class="card"><label for="week">対象週（月曜日）</label><div class="grid"><input id="week" type="date"><button id="thisWeek" class="secondary">今週に戻る</button></div><div class="muted" id="range"></div><div class="big"><span id="total">0</span><small style="font-size:16px"> 分</small></div><div class="muted" id="hours"></div></section><section class="card"><div class="days" id="days"></div><div class="top"><h2 id="dayTitle" style="font-size:18px">作業記録</h2><button id="add">＋ 作業追加</button></div><div id="entries"></div><div id="warning"></div></section><section class="card"><h2 style="font-size:18px">案件・作業別の週間集計</h2><div class="scroll"><table><thead><tr><th>案件 / 作業</th><th>分</th><th>時間(h)</th></tr></thead><tbody id="summary"></tbody></table></div><button id="csv" style="width:100%;margin-top:14px">週間集計CSVを出力</button><button id="detailCsv" class="secondary" style="width:100%;margin-top:8px">作業明細CSVを出力</button></section><section class="card"><h2 style="font-size:17px">休憩控除ルール</h2><p class="muted">10:00–10:15（15分）<br>12:00–12:45（45分）<br>15:00–15:15（15分）<br>17:30–17:45（15分）</p><p class="muted">通常勤務 8:30–17:30 → 実働465分。休憩と重なった時間のみ控除します。</p></section><footer>データはこの端末のブラウザ内に保存されます。Safariの履歴・Webサイトデータ削除や端末変更で消失する場合があります。定期的にCSVを保存してください。日付をまたぐ勤務には対応していません。異なる作業の時間帯が重複している場合は警告を表示します。</footer></main><script>
'use strict';const B=[[600,615],[720,765],[900,915],[1050,1065]],$=id=>document.getElementById(id),days=['月','火','水','木','金'];let selected=0,store;try{store=JSON.parse(localStorage.getItem('kosu-pwa-v1'))||{}}catch{store={}};let data=store&&typeof store==='object'?store:{};const pad=n=>String(n).padStart(2,'0'),fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,date=s=>new Date(s+'T12:00:00'),monday=s=>{let d=date(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return fmt(d)},plus=(s,n)=>{let d=date(s);d.setDate(d.getDate()+n);return fmt(d)},min=s=>{let a=s.split(':').map(Number);return a[0]*60+a[1]},calc=r=>{let a=min(r.start),b=min(r.end);if(b<a)return {gross:0,rest:0,net:0};let rest=B.reduce((t,[x,y])=>t+Math.max(0,Math.min(b,y)-Math.max(a,x)),0);return {gross:b-a,rest,net:b-a-rest}},timeOptions=Array.from({length:97},(_,i)=>`${pad(Math.floor(i/4))}:${pad(i%4*15)}`);let week=monday(fmt(new Date()));function entries(){return data[week]||[]}function save(){localStorage.setItem('kosu-pwa-v1',JSON.stringify(data))}function el(tag,attrs={},content){const n=document.createElement(tag);Object.entries(attrs).forEach(([k,v])=>{if(k==='class')n.className=v;else if(k==='value')n.value=v;else n.setAttribute(k,v)});if(content!==undefined)n.textContent=content;return n}function input(label,value,cb){let wrap=el('div'),l=el('label',{},label),i=el('input',{value});i.addEventListener('input',()=>{cb(i.value);save();refreshTotals()});wrap.append(l,i);return wrap}function timeSelect(label,value,cb){let w=el('div'),l=el('label',{},label),s=el('select');timeOptions.forEach(t=>s.append(el('option',{value:t},t)));s.value=value;s.addEventListener('change',()=>{cb(s.value);save();render()});w.append(l,s);return w}function add(){let a=entries();a.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),day:selected,project:'',task:'',start:'08:30',end:'17:30'});data[week]=a;save();render()}function render(){let w=date(week);$('week').value=week;$('range').textContent=`${week} 〜 ${plus(week,4)}`;let bar=$('days');bar.replaceChildren();days.forEach((name,i)=>{let b=el('button',{class:i===selected?'active':''});b.append(document.createTextNode(name),el('small',{},plus(week,i).slice(5).replace('-','/')),el('small',{},`${entries().filter(r=>r.day===i).reduce((a,r)=>a+calc(r).net,0)}分`));b.onclick=()=>{selected=i;render()};bar.append(b)});$('dayTitle').textContent=`${days[selected]}曜日の作業`;$('entries').replaceChildren();entries().filter(r=>r.day===selected).forEach(r=>{let box=el('div',{class:'entry'}),head=el('div',{class:'top'}),h=el('h3',{},'作業記録'),del=el('button',{class:'danger'},'削除');del.onclick=()=>{if(!confirm('この作業記録を削除しますか？'))return;data[week]=entries().filter(x=>x.id!==r.id);save();render()};head.append(h,del);box.append(head,input('案件名',r.project,v=>r.project=v),input('作業内容',r.task,v=>r.task=v));let g=el('div',{class:'grid'});g.append(timeSelect('開始時刻',r.start,v=>r.start=v),timeSelect('終了時刻',r.end,v=>r.end=v));box.append(g);let c=calc(r),result=el('div',{class:'result'});result.append(el('span',{},`休憩 ${c.rest}分控除`),el('strong',{},`${c.net}分`));box.append(result);$('entries').append(box)});refreshTotals()}function refreshTotals(){let all=entries(),total=all.reduce((a,r)=>a+calc(r).net,0);$('total').textContent=total.toLocaleString('ja-JP');$('hours').textContent=`${Math.floor(total/60)}時間${total%60}分 / ${(total/60).toFixed(2)}時間`;let groups=new Map;all.forEach(r=>{let key=JSON.stringify([r.project,r.task]),v=groups.get(key)||{project:r.project,task:r.task,minutes:0};v.minutes+=calc(r).net;groups.set(key,v)});let body=$('summary');body.replaceChildren();groups.forEach(v=>{let tr=el('tr');[`${v.project||'未入力'} / ${v.task||'未入力'}`,String(v.minutes),(v.minutes/60).toFixed(2)].forEach(t=>tr.append(el('td',{},t)));body.append(tr)});let warnings=[];for(let i=0;i<5;i++){let list=all.filter(r=>r.day===i).sort((a,b)=>min(a.start)-min(b.start));for(let j=1;j<list.length;j++){if(min(list[j].start)<min(list[j-1].end))warnings.push(`${days[i]}曜日に時間帯の重複があります`)}}if(all.some(r=>min(r.end)<min(r.start)))warnings.push('終了時刻が開始時刻より前の記録があります');$('warning').textContent=[...new Set(warnings)].join(' / ')}function csvFile(name,rows){const esc=v=>'"'+String(v??'').replaceAll('"','""')+'"',content='\ufeff'+rows.map(row=>row.map(esc).join(',')).join('\r\n');let url=URL.createObjectURL(new Blob([content],{type:'text/csv;charset=utf-8'}));let a=el('a',{href:url,download:name});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}$('csv').onclick=()=>{let groups=new Map;entries().forEach(r=>{let k=JSON.stringify([r.project,r.task]),v=groups.get(k)||{project:r.project,task:r.task,minutes:0};v.minutes+=calc(r).net;groups.set(k,v)});csvFile(`週間工数集計_${week}.csv`,[['対象週','案件名','作業内容','合計(分)','合計(時間)'],...[...groups.values()].map(v=>[week,v.project,v.task,v.minutes,(v.minutes/60).toFixed(2)])])};$('detailCsv').onclick=()=>csvFile(`週間工数明細_${week}.csv`,[['日付','案件名','作業内容','開始','終了','拘束(分)','休憩(分)','実働(分)'],...entries().map(r=>{let c=calc(r);return [plus(week,r.day),r.project,r.task,r.start,r.end,c.gross,c.rest,c.net]})]);$('add').onclick=add;$('week').onchange=e=>{if(!e.target.value)return;week=monday(e.target.value);selected=0;render()};$('thisWeek').onclick=()=>{week=monday(fmt(new Date()));selected=0;render()};render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
